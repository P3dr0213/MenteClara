services:
  db:
    image: postgres:16-alpine
    container_name: mente-clara-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: mente_clara
    volumes:
      - mente-clara-postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mente_clara"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  mente-clara-postgres-data:

secrets:
  postgres_admin_password:
    file: ./.local/postgres-admin-password
